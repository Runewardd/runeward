# Security automation: SAST (gosec), Go vuln scanning (govulncheck), and
# repo + container image scanning (Trivy). Results are uploaded as SARIF so
# they surface in the repository's Security > Code scanning tab.
#
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full sweep (Mondays 06:17 UTC) to catch newly disclosed CVEs
    # even when the repo is quiet.
    - cron: "17 6 * * 1"

# Least-privilege default: jobs only read the repo. Jobs that upload SARIF
# opt into `security-events: write` explicitly below.
permissions:
  contents: read

jobs:
  # SAST: static analysis of the Go source with gosec.
  gosec:
    name: gosec (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run gosec
        id: gosec
        continue-on-error: true
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 \
            -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: gosec.sarif
          category: gosec
      - name: Enforce gosec gate
        if: steps.gosec.outcome == 'failure'
        run: |
          echo "::error::gosec reported an unsuppressed security finding"
          exit 1

  # Dependency + Go stdlib vulnerability scanning. govulncheck only reports
  # vulnerabilities that are actually reachable from this codebase.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          # Pin to the patch that fixes standard library vulnerabilities
          # (GO-2026-4599/4600/4601/4602/4603/4865, etc.) present in go1.26.0.
          go-version: "1.26.5"
          cache: true
      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  # Filesystem scan of the repo: vulnerable dependencies, committed secrets,
  # and IaC/Dockerfile misconfigurations.
  trivy-fs:
    name: trivy (fs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Trivy filesystem scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          # Keep accepted, path-scoped architecture exceptions reviewable in
          # source instead of re-failing findings already dismissed in GitHub.
          trivyignores: .trivyignore.yaml
          limit-severities-for-sarif: true
          output: trivy-fs.sarif
      - name: Upload Trivy fs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Enforce Trivy filesystem gate
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Trivy reported a high or critical repository finding"
          exit 1

  # Container image scan. Each Dockerfile is built locally (no push) and then
  # scanned for CRITICAL/HIGH OS + library vulnerabilities. A distinct SARIF
  # `category` per image keeps the uploads from colliding in the Security tab.
  trivy-image:
    name: trivy (image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: deploy/Dockerfile
            image: runeward
          - dockerfile: deploy/Dockerfile.egress
            image: runeward-egress
          - dockerfile: deploy/Dockerfile.agent
            image: runeward-agent
          - dockerfile: deploy/Dockerfile.sandbox
            image: runeward-sandbox
          - dockerfile: deploy/Dockerfile.ide
            image: runeward-ide
          - dockerfile: deploy/Dockerfile.ide-agents
            image: runeward-ide-agents
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build ${{ matrix.image }} image
        run: |
          docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:ci .
      - name: Trivy image scan (${{ matrix.image }})
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          # Runtime images are a security boundary. Keep SARIF for triage, but
          # also fail the workflow so a high/critical regression cannot ship.
          exit-code: "1"
          format: sarif
          # trivy-action otherwise expands SARIF back to every severity, which
          # also makes exit-code fail on findings outside the configured gate.
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.image }}.sarif
      - name: Upload Trivy image SARIF (${{ matrix.image }})
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}
