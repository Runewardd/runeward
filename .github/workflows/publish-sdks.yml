name: publish SDKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, with or without the v prefix"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Verify tag and package versions
        run: python3 scripts/check-sdk-versions.py "${{ inputs.version || github.ref_name }}"

  build-python:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m pip install ./adapters/python
          python -m unittest discover -s adapters/python/tests
          python -m build adapters/python
          python -m twine check adapters/python/dist/*
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-distributions
          path: adapters/python/dist/
          if-no-files-found: error

  publish-python:
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runeward
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish runeward to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  publish-npm:
    needs: verify-version
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@runeward/sdk
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: adapters/typescript
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install and validate package
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm pack --dry-run
      - name: Publish @runeward/sdk to npm
        run: npm publish
