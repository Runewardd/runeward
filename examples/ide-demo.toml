# Optional browser IDE (code-server) inside a Citadel.
#
# Docs (setup + limitations): docs/browser-ide.md
#
#   docker build --target ide -f deploy/Dockerfile.ide -t runeward-ide:latest .
#   RUNEWARD_ENABLE_EXPERIMENTAL_IDE=1 runeward --config-dir examples serve
#   POST /v1/citadels {"profile":"ide-demo"}
#   POST /v1/tickets {"kind":"ide","sandbox_id":"<id>"}
#   open /v1/citadels/<id>/ide?ticket=<ticket>
#
# IDE keystrokes are not per-command policy gates (same as the interactive
# terminal). Isolation, egress, and ownership still apply.

[host]
type    = "container"
image   = "runeward-ide:latest"
user    = "coder"
workdir = "/workspace"

[ide]
enabled = true
port    = 8080

# Local IDE only — no outbound network by default.
[network]
default = "deny"

[rationing]
wall_clock = "2h"
max_execs  = 50

[chronicle]
redact = true
