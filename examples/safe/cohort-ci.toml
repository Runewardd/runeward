# Fail-closed multi-agent Cohort with leased work claims.
policy_default = "deny"

[host]
type      = "container"
image     = "debian:bookworm-slim"
user      = "65532"
workdir   = "/workspace"
read_only = true

[network]
default = "deny"

[[network.rule]]
verdict  = "allow"
hostname = "api.openai.com"

[[network.rule]]
verdict  = "allow"
hostname = "api.anthropic.com"

[[policy]]
tool    = "file.read"
match   = "*"
verdict = "allow"
reason  = "workspace reads are allowed"

[[policy]]
tool    = "file.write"
match   = "src/*"
verdict = "allow"
reason  = "source changes are allowed"

[[policy]]
tool    = "file.write"
match   = "*"
verdict = "require-approval"
reason  = "shared configuration changes require review"

[[policy]]
tool       = "shell"
match_argv = "git"
verdict    = "allow"
reason     = "git commands are allowed inside the isolated workspace"

[[policy]]
tool       = "shell"
match_argv = "go"
verdict    = "allow"
reason     = "Go builds and tests are allowed"

[[policy]]
tool       = "shell"
match_argv = "npm"
verdict    = "allow"
reason     = "npm project scripts are allowed"

[cohort]
replicas = 3
task_board = ["implement", "test", "review"]

[rationing]
wall_clock      = "1h"
max_execs       = 600
memory          = "1g"
cpus            = 1.0
egress_requests = 1200
loop_window     = "2m"
loop_threshold  = 8
max_tokens      = 500000
max_cost_usd    = 60.0

[chronicle]
redact = true
